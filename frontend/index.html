<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>InvestIQ — Stock Market Intelligence Platform</title>
    
    <!-- PWA Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#00D09C" />
    
    <!-- iOS Web App Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="InvestIQ" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body style="background-color: #0A0D14; color: #f1f5f9; margin: 0; min-height: 100vh;" class="bg-[#0A0D14] text-slate-100 antialiased selection:bg-emerald-500 selection:text-black">
    <div id="root">
      <div style="min-height: 100vh; background-color: #0A0D14; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #94a3b8;">
        <div style="width: 44px; height: 44px; border: 3px solid rgba(0, 208, 156, 0.2); border-top-color: #00D09C; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <p style="margin-top: 18px; font-weight: 800; font-size: 14px; color: #ffffff; letter-spacing: 0.5px;">Loading InvestIQ Intelligence Platform...</p>
        <span style="font-size: 11px; color: #64748b; margin-top: 4px;">Connecting to real-time market feeds</span>
        <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
